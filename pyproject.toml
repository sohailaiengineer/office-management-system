[project]
name = "office-management-system"
version = "2.0.0"
description = "Enterprise Office Management System (OMS) built with Python Flask and MySQL 8"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "wtforms>=3.3.2",
    "pymysql>=1.2.3",
    "cryptography>=50.0.2",
    "python-dotenv>=1.2.4",
    "openpyxl>=3.1.5",
    "email-validator>=2.3.0",
    "werkzeug>=3.1.9",
    "jinja2>=3.1.6",
]

[tool.vercel]
entrypoint = "run.py"

